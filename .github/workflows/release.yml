name: Build and Release (Windows & Linux AppImage)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1 libfontconfig1 libdbus-1-3 wget file

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller VeraNote.spec --noconfirm

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy PyInstaller binary directory
          cp -r dist/VeraNote/* AppDir/usr/bin/
          
          # Copy desktop file and icons
          cp veranote.desktop AppDir/
          cp assets/app_icon.png AppDir/veranote.png
          cp assets/app_icon.png AppDir/.DirIcon
          cp assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/veranote.png

          # Create AppRun launcher
          cat << 'EOF' > AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/_internal:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/VeraNote" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Package AppImage using appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract

          VERSION=${GITHUB_REF_NAME:-v2.0.0}
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "VeraNote-${VERSION}-x86_64.AppImage"

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeraNote-Linux-AppImage
          path: VeraNote-*-x86_64.AppImage

  build-windows-zip:
    name: Build Windows ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller VeraNote.spec --noconfirm

      - name: Compress Windows Distribution
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if (-not $version) { $version = "v2.0.0" }
          Compress-Archive -Path "dist\VeraNote" -DestinationPath "VeraNote-$version-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeraNote-Windows-Zip
          path: VeraNote-*-windows-x64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-linux-appimage, build-windows-zip]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
